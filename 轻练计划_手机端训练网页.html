<script>
(()=>{'use strict';
const KEY='qinglian-v1';

let page='today',mode='full',detailId=null,preflight=false,finished=null,rest=null,tick=null;
const exercise=[
{id:'squat',name:'椅子深蹲',target:'下肢与臀部',amount:'10 次',count:10,equip:'徒手 + 稳固椅子',help:'慢慢坐向椅面，轻触后站起。动作全程呼吸自然。',warning:'膝盖大致朝向脚尖；腰背保持自然，不要猛地坐下。',steps:[['准备站立','站在稳固椅子前，双脚约与肩同宽，眼睛看向前方。'],['缓慢下坐','髋部向后，屈膝下蹲，臀部轻触椅面即可，不要跌坐。'],['站直复位','脚掌稳定踩地，呼气站起，回到起始姿势。']]},
{id:'push',name:'高位俯卧撑',target:'胸、肩、手臂',amount:'8 次',count:8,equip:'稳固台面',help:'双手撑稳固台面，身体保持直线，缓慢靠近台面再推开。',warning:'避免塌腰、耸肩；台面必须固定，不使用易滑动家具。',steps:[['撑稳台面','双手放在牢固台面上，后撤双脚，身体保持自然直线。'],['屈肘靠近','缓慢弯曲手肘，让胸部向台面方向靠近，保持腹部轻微收紧。'],['推回起点','呼气推直手臂，保持腰背稳定，不要弹起。']]},
{id:'row',name:'单臂支撑划船',target:'背部与上臂',amount:'左右各 12 次',count:12,equip:'1 kg 哑铃 + 稳固台面',help:'一手支撑、另一手持 1 kg 哑铃拉向髋部，左右侧分别做。',warning:'腰背保持中立，不要借助扭腰或耸肩把哑铃拉起。',steps:[['稳定支撑','一手支撑稳固台面，膝微屈，另一手持哑铃自然下垂。'],['拉向髋部','肩胛轻轻后收，屈肘将哑铃沿身体侧方拉向髋部。'],['缓慢下降','保持躯干稳定，将哑铃缓慢放回起点，再换侧。']]},
{id:'bridge',name:'臀桥',target:'臀部、髋部',amount:'12 次',count:12,equip:'徒手 + 地垫',help:'仰卧屈膝，脚踩稳地面，收紧臀部把髋部平稳抬起。',warning:'不要为了抬得更高而过度反弓腰部。出现腰腿放射痛应停止。',steps:[['仰卧准备','仰卧屈膝，双脚踩地，双臂置于身体两侧。'],['收臀抬髋','收紧臀肌，呼气将髋部抬起至肩、髋、膝大致成线。'],['控制下放','缓慢放低髋部，回到地面后重复。']]},
{id:'raise',name:'哑铃侧平举',target:'肩部（选做）',amount:'8–10 次',count:8,equip:'每手 1 kg 哑铃',help:'轻握两只 1 kg 哑铃，双肘微屈，慢慢向身体两侧抬起。',warning:'不超过肩部高度；不耸肩、不甩动。疼痛或控制不住就暂停。',steps:[['身体站稳','双脚稳定站立，两手各握一只 1 kg 哑铃，手臂自然垂于身体两侧。'],['向两侧抬起','双肘微屈，慢慢抬起至不高于肩部，保持肩膀放松。'],['缓慢下放','控制哑铃回到体侧，不借助身体摆动。']]}
];

}else if(id==='raise'){
 s+=head(120,25,11)+line('M120 39L120 91',11)+line('M120 91L101 134')+line('M120 91L141 134')+line('M97 135h17')+line('M134 135h17');
 if(stage===1){s+=line('M111 54L86 58L59 61')+line('M129 54L154 58L181 61')+db(56,61)+db(184,61)}else{s+=line('M111 54L102 79L101 105')+line('M129 54L138 79L139 105')+db(101,109)+db(139,109)}
}
s+='</svg>';return s;
}
function render(){
 const app=document.querySelector('#app');
 app.innerHTML=`<div class="topbar"><div class="brand"><span class="brandmark">${svgicon('check')}</span>轻练计划</div><span class="today">${new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date())}</span></div><section id="todayPage" class="${page==='today'?'':'hide'}">${homePage()}</section><section id="movesPage" class="${page==='moves'?'':'hide'}">${movesPage()}</section><section id="historyPage" class="${page==='history'?'':'hide'}">${settingsPage()}</section><div class="footer-mini">为稳定坚持而设计 · 训练无需完美</div>`;
 const nav=document.querySelector('#bottomNav');nav.innerHTML=[['today','home','今天'],['moves','list','动作'],['history','chart','记录与设置']].map(([id,icon,label])=>`<button class="navitem ${page===id?'active':''}" data-page="${id}" aria-current="${page===id?'page':'false'}">${svgicon(icon)}<span>${label}</span></button>`).join('');
 if(S.active) renderSession(); else if(finished)renderFinish();else if(detailId)renderDetail();else if(preflight)renderPreflight();else if(rest)renderRest();else document.querySelector('#portal').innerHTML='';
}
function homePage(){const counts=weekCounts(),last=S.history[0];const d=weekMonday();let days='';for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);const y=dayKey(x);const has=S.history.some(r=>r.date===y&&r.mode==='full');days+=`<div class="day ${has?'completed':''} ${[1,4].includes(i)?'suggested':''} ${y===dayKey()?'today':''}"><span>${['一','二','三','四','五','六','日'][i]}</span><span class="dot">${has?'✓':x.getDate()}</span></div>`}
return `<div class="hero"><div class="eyebrow">SMALL STEPS · STRONGER DAYS</div><h1>不求练很多，<br>只要开始就好。</h1><p>两只 1 kg 哑铃，配合徒手动作。每周两次，给身体一点稳定的力量。</p></div><div class="stats"><div class="stat"><div class="stat-top">本周完整训练 ${svgicon('check')}</div><div class="stat-big">${Math.min(counts.full,2)}<span class="stat-small"> / 2 次</span></div></div><div class="stat"><div class="stat-top">本周短练习 ${svgicon('clock')}</div><div class="stat-big">${counts.short}<span class="stat-small"> 次</span></div></div></div><div class="section-title"><h2>今天练一点</h2><span class="eyebrow">适合你的节奏</span></div><div class="surface"><div class="session-pick">${[['full','完整','4 个基础动作'],['light','轻量','3 个动作'],['minimum','保底','2 个动作']].map(([id,a,b])=>`<button class="pick ${mode===id?'active':''}" data-mode="${id}" aria-pressed="${mode===id}"><strong>${a}</strong><small>${b}</small></button>`).join('')}</div><div class="primary-wrap"><button class="cta" id="start">${S.active?'继续训练':'开始'+({full:'完整训练',light:'轻量训练',minimum:'保底练习'}[mode])} ${svgicon('arrow')}</button></div><p class="helper">${mode==='full'?'推荐每周完成 2 次，完成后计入本周完整训练。':mode==='light'?'适合有点疲劳的日子，作为短练习记录。':'适合启动困难的日子，不把它当作完整增肌训练。'}${last?` 上次记录：${last.date.slice(5)}。`:''}</p></div><div class="section-title"><h2>本周节奏</h2><span class="micro">建议二 / 五 · 可灵活调整</span></div><div class="surface"><div class="weekdays">${days}</div><p class="helper" style="margin-top:15px">绿色勾表示当日完成了完整训练。避免连续两天高强度练同一肌群。</p></div><div class="section-title"><h2>你的 8 周路线</h2><span class="micro">不舒服可延长当前阶段</span></div><div class="surface" style="padding:8px 17px"><div class="settingrow"><div><div class="setting-title">第 1–2 周 · 建立习惯</div><div class="setting-desc">每周两次 · 每动作 1 组 · 约 10–15 分钟</div></div><span class="pill">起步</span></div><div class="settingrow"><div><div class="setting-title">第 3–4 周 · 小幅增加</div><div class="setting-desc">身体适应后，深蹲与俯卧撑可增至 2 组</div></div><span class="pill">渐进</span></div><div class="settingrow"><div><div class="setting-title">第 5–8 周 · 稳定强化</div><div class="setting-desc">逐渐练到每动作 2 组，轻松后再加阻力</div></div><span class="pill">进阶</span></div></div><div class="tips"><div class="tips-icon">${svgicon('shield')}</div><p><strong>先确认身体状态。</strong> 如出现明显困倦、头晕、站立不稳或反应迟缓，今天不做负重训练；骑车也应暂停。没有腰腿痛才按当前计划练习。</p></div>`}
function movesPage(){return `<div class="page-head"><div class="eyebrow">MOVE LIBRARY</div><h1>五个动作，慢慢练</h1><p>前四个是完整训练的基础动作，侧平举为选做。插图为本网页原创的动作分解示意图；点击查看每一步的说明。</p></div>${exercise.map((e,i)=>`<button class="exercise-card" data-detail="${e.id}" style="width:100%;text-align:left"><div class="ex-thumb">${pose(e.id,0)}</div><div class="ex-info"><h3>${String(i+1).padStart(2,'0')} · ${e.name}</h3><p>${e.target} · ${e.amount}</p><span class="pill">${e.equip}</span></div><span class="arrow">›</span></button>`).join('')}<div class="safety">训练中不要憋气或追求力竭。已知有腰椎相关病史，即使目前无腰腿痛，也应避免借力扭转；出现腰腿放射痛、麻木或肌无力时停止训练并就医评估。</div>`}
function settingsPage(){const count=S.history.filter(r=>r.mode==='full').length,short=S.history.filter(r=>r.mode!=='full').length;return `<div class="page-head"><div class="eyebrow">YOUR PACE</div><h1>记录与设置</h1><p>可以随时调节训练难度和休息时间。训练记录仅存放在当前浏览器，不会上传到服务器。</p></div><div class="stats"><div class="stat"><div class="stat-top">累计完整训练</div><div class="stat-big">${count}<span class="stat-small"> 次</span></div></div><div class="stat"><div class="stat-top">累计短练习</div><div class="stat-big">${short}<span class="stat-small"> 次</span></div></div></div><div class="section-title"><h2>训练偏好</h2></div><div class="surface"><div class="settingrow"><div><div class="setting-title">休息倒计时</div><div class="setting-desc">完成一组后自动开始，可以暂停或跳过</div></div><button class="toggle ${S.timerEnabled?'active':''}" id="toggleTimer" role="switch" aria-label="启用休息倒计时" aria-checked="${S.timerEnabled}"></button></div><div class="settingrow" style="display:block"><div class="setting-title">每组休息时长</div><div class="segments">${[20,30,45,60,90].map(v=>`<button class="segment ${S.restSeconds===v?'active':''}" data-duration="${v}" aria-pressed="${S.restSeconds===v}">${v} 秒</button>`).join('')}</div></div><div class="settingrow" style="display:block"><div class="setting-title">完整训练的组数</div><div class="setting-desc">以下周数是建议节奏；先练稳，再按恢复情况手动进阶</div><div class="segments">${[[1,'第1–2周 · 1组'],[2,'第3–4周 · 部分2组'],[3,'第5–8周 · 全部2组']].map(([v,t])=>`<button class="segment ${S.phase===v?'active':''}" data-phase="${v}" aria-pressed="${S.phase===v}">${t}</button>`).join('')}</div></div><div class="settingrow"><div><div class="setting-title">加入选做侧平举</div><div class="setting-desc">仅完整训练添加，每手各持 1 kg 哑铃</div></div><button class="toggle ${S.lateral?'active':''}" id="toggleLateral" role="switch" aria-label="在完整训练中加入侧平举" aria-checked="${S.lateral}"></button></div></div><div class="section-title"><h2>最近记录</h2><button class="textlink" id="export">导出 JSON</button></div><div class="surface">${S.history.length?S.history.slice(0,12).map(r=>`<div class="history-item"><div><div class="history-type">${{full:'完整训练',light:'轻量训练',minimum:'保底练习'}[r.mode]||'练习'}</div><div class="history-date">${r.date} · ${r.finishedSets} 组</div></div><div class="history-right">已完成 ✓</div></div>`).join(''):'<div class="empty">还没有训练记录。<br>第一回合，做得少也没关系。</div>'}</div><div class="disclaimer">这是习惯培养和一般运动辅助工具，不是医疗处方。动作难度、器械重量和训练日程可按身体反应调整。如出现胸痛、晕厥、明显心悸、严重呼吸困难或神经症状，应停止运动并及时寻求医疗帮助。<br><br>本地记录依赖浏览器存储；清理浏览器数据、使用隐私模式或换设备可能导致记录丢失。</div>`}
function openDetail(id){detailId=id;page='moves';render();}
function renderDetail(){const e=ex(detailId);if(!e)return;document.querySelector('#portal').innerHTML=`<div class="overlay" id="detailOverlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${e.name}动作详情"><div class="handle"></div><div class="modal-top"><div><div class="eyebrow">动作分解 / 03 STEPS</div><h2>${e.name}</h2></div><button class="iconbtn" id="closeDetail" aria-label="关闭动作详情">×</button></div><div class="details-meta">${e.target} · ${e.amount} · ${e.equip}</div>${e.steps.map(([t,p],i)=>`<div class="step-card"><div class="illustration">${pose(e.id,i)}</div><h3>${String(i+1).padStart(2,'0')} · ${t}</h3><p>${p}</p></div>`).join('')}<div class="callout"><strong>安全要点：</strong>${e.warning}</div><button class="cta ghost" style="margin-top:15px" id="closeDetailsBottom">我知道了</button></div></div>`;}
function renderPreflight(){document.querySelector('#portal').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="运动前安全确认"><div class="handle"></div><div class="modal-top"><h2>先确认今天的状态</h2><button class="iconbtn" id="closePreflight" aria-label="关闭">×</button></div><div class="safety">如果你现在明显困倦、头晕、站立不稳、反应迟缓，或者出现胸痛、异常心悸、腰腿放射痛等不适，今天不要做负重训练。必要时及时就医。</div><p class="helper" style="margin:15px 2px">轻训练不是硬撑。身体不舒服时休息，也是认真对待训练的一部分。</p><button class="cta" id="safeStart">现在状态良好，开始训练 ${svgicon('arrow')}</button><button class="cta ghost" id="restToday" style="margin-top:10px">今天先休息</button></div></div>`;}
function stepsFor(mode){let ids=mode==='minimum'?['squat','push']:mode==='light'?['squat','push','row']:['squat','push','row','bridge',...(S.lateral?['raise']:[])];let arr=[];for(let round=1;round<=(mode==='full'&&S.phase>1?2:1);round++)ids.forEach(id=>{if(mode==='full'&&S.phase===2&&round===2&&!['squat','push'].includes(id))return;arr.push({id,round})});return arr}
function startSession(){S.active={mode,steps:stepsFor(mode),index:0,started:Date.now()};preflight=false;save();render()}
function renderSession(){const a=S.active;if(!a)return;const task=a.steps[a.index];if(!task)return;const e=ex(task.id);const plural=a.mode==='full'&&S.phase>1?` · 第 ${task.round} 组`:'';document.querySelector('#portal').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="正在训练" style="max-height:98dvh"><div class="handle"></div><div class="modal-top"><div class="eyebrow">${({full:'完整训练',light:'轻量训练',minimum:'保底练习'}[a.mode])} · ${a.index+1} / ${a.steps.length}</div><button class="iconbtn" id="endSession" aria-label="退出训练">×</button></div><div class="training-hero"><div class="eyebrow">MOVE ${String(a.index+1).padStart(2,'0')}</div><h2 class="session-title">${e.name}${plural}</h2><div class="session-instruction">${e.amount} · ${e.equip}</div><div class="training-progress"><div style="width:${(a.index/a.steps.length)*100}%"></div></div><div class="micro">完成 ${a.index} / ${a.steps.length} 组</div></div><div class="training-figure"><div class="illustration">${pose(e.id,1)}</div><h3>动作要点</h3><p>${e.help}</p><div class="callout" style="margin-top:10px">${e.warning}</div></div><div class="split-actions"><button class="cta ghost compact" id="showCurrentDetail">查看分解图</button><button class="cta compact" id="completeSet">完成这一组 ${svgicon('check')}</button></div><p class="helper" style="text-align:center">无需做到力竭。如果现在不舒服，随时退出并休息。</p></div></div>`;}
function completeSet(){const a=S.active;if(!a)return;a.index++;save();if(a.index>=a.steps.length){finished={mode:a.mode,steps:a.steps.length,date:dayKey()};S.history.unshift({mode:a.mode,finishedSets:a.steps.length,date:dayKey(),time:Date.now()});S.active=null;save();rest=null;render();return;}if(S.timerEnabled){rest={total:S.restSeconds,remaining:S.restSeconds,deadline:Date.now()+S.restSeconds*1000,paused:false};renderRest();startTicker()}else render()}
function startTicker(){if(tick)clearInterval(tick);tick=setInterval(()=>{if(!rest||rest.paused){if(!rest)clearInterval(tick);return}rest.remaining=Math.max(0,Math.ceil((rest.deadline-Date.now())/1000));const t=document.querySelector('#remaining'),circle=document.querySelector('#restCircle');if(t)t.textContent=String(rest.remaining);if(circle)circle.style.setProperty('--pct',`${(rest.remaining/rest.total)*100}%`);if(rest.remaining<=0){skipRest();if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}}},180)}
function skipRest(){rest=null;if(tick)clearInterval(tick);tick=null;render()}
function renderRest(){if(!rest)return;document.querySelector('#portal').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="组间休息计时"><div class="handle"></div><div class="eyebrow" style="text-align:center">REST & RECOVER</div><h2 style="text-align:center;margin:11px 0 5px">休息一下，再继续</h2><p class="helper" style="text-align:center">下一组：${ex(S.active.steps[S.active.index].id).name}</p><div class="rest-circle" id="restCircle" style="--pct:${rest.remaining/rest.total*100}%"><span class="rest-num"><span id="remaining">${rest.remaining}</span><small> 秒</small></span></div><div class="split-actions"><button class="cta ghost" id="pauseRest">${rest.paused?'继续倒计时':'暂停倒计时'}</button><button class="cta" id="skipRest">跳过休息 ${svgicon('arrow')}</button></div><p class="helper" style="text-align:center">休息时正常呼吸，先不要急着拿起哑铃。</p></div></div>`;}
function endSession(){if(rest)skipRest();if(S.active&&S.active.index>0){if(confirm('要退出这次训练吗？未完成的训练不会计入完整记录。')){S.active=null;save();render()}}else{S.active=null;save();render()}}
function renderFinish(){document.querySelector('#portal').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="训练完成"><div class="handle"></div><div class="check">${svgicon('check')}</div><div class="eyebrow" style="text-align:center">WELL DONE</div><h2 class="finish-title">今天已经做到了</h2><p class="finish-note">完成 <strong>${finished.steps}</strong> 组${finished.mode==='full'?'完整训练':'短练习'}。不需要补做，也不必和昨天比较。<br>接下来喝点水，感受身体是否舒适。</p><button class="cta" id="finishOK" style="margin-top:23px">返回首页</button></div></div>`;}
const portal=()=>document.querySelector('#portal');
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0);return}
 if(b.dataset.mode){mode=b.dataset.mode;render();return}
 if(b.id==='start'){if(S.active)renderSession();else {preflight=true;render()}return}
 if(b.dataset.detail){openDetail(b.dataset.detail);return}
 if(b.id==='closeDetail'||b.id==='closeDetailsBottom'){detailId=null;render();return}
 if(b.id==='closePreflight'||b.id==='restToday'){preflight=false;render();return}
 if(b.id==='safeStart'){startSession();return}
 if(b.id==='toggleTimer'){S.timerEnabled=!S.timerEnabled;save();render();return}
 if(b.dataset.duration){S.restSeconds=Number(b.dataset.duration);save();render();return}
 if(b.dataset.phase){S.phase=Number(b.dataset.phase);save();render();return}
 if(b.id==='toggleLateral'){S.lateral=!S.lateral;save();render();return}
 if(b.id==='completeSet'){completeSet();return}
 if(b.id==='showCurrentDetail'){const id=S.active.steps[S.active.index].id;const e=ex(id);let html=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${e.name}分解图"><div class="handle"></div><div class="modal-top"><h2>${e.name}</h2><button class="iconbtn" id="closeSessionDetail" aria-label="关闭">×</button></div>${e.steps.map(([t,p],i)=>`<div class="step-card"><div class="illustration">${pose(id,i)}</div><h3>${i+1}. ${t}</h3><p>${p}</p></div>`).join('')}<button class="cta" style="margin-top:12px" id="closeSessionDetail2">返回训练</button></div></div>`;portal().innerHTML=html;return}
 if(b.id==='closeSessionDetail'||b.id==='closeSessionDetail2'){renderSession();return}
 if(b.id==='endSession'){endSession();return}
 if(b.id==='pauseRest'&&rest){if(rest.paused){rest.paused=false;rest.deadline=Date.now()+rest.remaining*1000;startTicker()}else{rest.remaining=Math.max(0,Math.ceil((rest.deadline-Date.now())/1000));rest.paused=true}renderRest();return}
 if(b.id==='skipRest'){skipRest();return}
 if(b.id==='finishOK'){finished=null;page='today';render();return}
 if(b.id==='export'){const file=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),records:S.history},null,2)],{type:'application/json'});const url=URL.createObjectURL(file);const anchor=document.createElement('a');anchor.href=url;anchor.download='轻练训练记录_'+dayKey()+'.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&rest&&!rest.paused)startTicker()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&detailId&&!S.active){detailId=null;render()}else if(e.key==='Escape'&&preflight){preflight=false;render()}});
render();
})();
</script>
</body>
